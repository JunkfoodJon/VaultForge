[package]
name = "vaultforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "VaultForge - a fast, offline build launcher for your Rust and Python projects on Windows"
authors = ["JunkfoodJon"]
license-file = "LICENSE.md"
repository = "https://github.com/JunkfoodJon/VaultForge"
readme = "README.md"
publish = false

[dependencies]
# glow (OpenGL) is the default renderer; wgpu (Direct3D 12 / Vulkan) is the
# fallback for machines whose OpenGL driver is missing or too old.
eframe = { version = "0.31.1", default-features = true, features = ["wgpu"] }
egui = "0.31.1"
rfd = { version = "0.15", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
walkdir = "2.5.0"

[build-dependencies]
embed-resource = "3.0.9"
image = { version = "0.25.10", default-features = false, features = ["ico"] }

[[bin]]
name = "VaultForge"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
