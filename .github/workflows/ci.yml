name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Check the exe needs no Visual C++ Redistributable
        shell: pwsh
        run: |
          $bin = [IO.File]::ReadAllBytes("target\release\VaultForge.exe")
          if ([Text.Encoding]::ASCII.GetString($bin).Contains("VCRUNTIME140")) { throw "VaultForge.exe imports VCRUNTIME140.dll" }
