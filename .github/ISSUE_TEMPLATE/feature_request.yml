name: Feature request
description: An idea that would make VaultForge more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
